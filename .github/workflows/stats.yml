name: Жизнь проекта
# Counts the 50 figures shown on the «Обновление» page and publishes them to the `stats` branch:
# an install from a ZIP has no git history, so it reads them from there.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: project-stats
  cancel-in-progress: true
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Посчитать показатели
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/project-stats.mjs --out "$RUNNER_TEMP/project-stats.json"
      - name: Опубликовать в ветку stats
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP" && rm -rf out && mkdir out && cd out
          git init -q -b stats
          cp ../project-stats.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add project-stats.json
          git commit -q -m "Показатели для ${GITHUB_SHA::8}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
